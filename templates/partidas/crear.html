{% extends "base.html" %}

{% block title %}pokerVitoria | Crear partida{% endblock %}

{% block barra_superior %}
    <a class="boton-icono" href="{% url 'nucleo:inicio' %}" aria-label="Volver">←</a>
    <div></div>
{% endblock %}

{% block content %}
    <h1 class="titulo-seccion">Crear partida</h1>
    <form class="formulario" method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="grupo-campo">
                <label class="etiqueta" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <button class="boton" type="submit">Crear</button>
    </form>
{% endblock %}
