{% extends "base.html" %}

{% block title %}Pokervitoria | Perfil{% endblock %}

{% block content %}
<article>
    <h1>Perfil de usuario</h1>
    <p>Esta pagina confirma que el sistema de autenticacion ya funciona.</p>
    <ul>
        <li><strong>Usuario:</strong> {{ user.username }}</li>
        <li><strong>Correo electronico:</strong> {{ user.email|default:"No definido" }}</li>
    </ul>
</article>
{% endblock %}
