<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pokervitoria{% endblock %}</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            margin: 0;
            background: #f4efe6;
            color: #1f1f1f;
        }

        header {
            background: #16302b;
            color: #f8f3ea;
            padding: 1rem 1.5rem;
        }

        nav {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        nav a,
        nav button {
            color: inherit;
            text-decoration: none;
            font: inherit;
        }

        nav form {
            margin: 0;
        }

        button,
        .boton {
            border: 0;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            background: #b08968;
            color: #fff;
            cursor: pointer;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        section,
        article {
            background: #fff;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        form {
            display: grid;
            gap: 1rem;
        }

        form p {
            margin: 0;
            display: grid;
            gap: 0.4rem;
        }

        input {
            padding: 0.75rem;
            border: 1px solid #cbbba7;
            border-radius: 0.5rem;
        }

        ul {
            padding-left: 1.2rem;
        }

        .acciones {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .mensaje {
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #e8f3ed;
            border: 1px solid #b8d4c2;
        }

        .mensaje.error {
            background: #fbe9e7;
            border-color: #e0b4ad;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'nucleo:inicio' %}">Inicio</a>
            {% if user.is_authenticated %}
                <a href="{% url 'partidas:lista' %}">Partidas</a>
                <a href="{% url 'usuarios:perfil' %}">Perfil</a>
                <form method="post" action="{% url 'usuarios:cerrar_sesion' %}">
                    {% csrf_token %}
                    <button type="submit">Cerrar sesion</button>
                </form>
            {% else %}
                <a href="{% url 'usuarios:registro' %}">Registro</a>
                <a href="{% url 'usuarios:iniciar_sesion' %}">Iniciar sesion</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="mensaje {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
