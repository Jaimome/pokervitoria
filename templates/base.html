{% load texto %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}pokerVitoria{% endblock %}</title>
    <style>
        :root {
            --fondo: #f5efe6;
            --fondo-panel: #fffdfa;
            --fondo-secundario: #efe8de;
            --texto: #1b1b1b;
            --texto-suave: #5f584f;
            --borde: #d8ccbd;
            --borde-activo: #bc9a76;
            --acento: #b98d66;
            --acento-oscuro: #8d6442;
            --exito: #dfeee5;
            --error: #f8e1dc;
            --error-borde: #d69a90;
            --sombra: 0 24px 50px rgba(36, 27, 19, 0.12);
            --radio: 1.4rem;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(185, 141, 102, 0.08), transparent 40%),
                var(--fondo);
            color: var(--texto);
            font-family: "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app-shell {
            width: min(100%, 31rem);
            min-height: min(94vh, 62rem);
            aspect-ratio: 1 / 2;
            background: var(--fondo-panel);
            border: 1px solid rgba(216, 204, 189, 0.72);
            border-radius: calc(var(--radio) + 0.4rem);
            box-shadow: var(--sombra);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .pantalla {
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        .pantalla--centrada .contenido-scroll {
            justify-content: center;
        }

        .barra-superior {
            min-height: 4.5rem;
            padding: 1.2rem 1.2rem 0.8rem;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.8rem;
        }

        .contenido-scroll {
            flex: 1;
            padding: 0.4rem 1.5rem 1.6rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            gap: 1.25rem;
        }

        .panel-formulario-central {
            display: grid;
            gap: 1.1rem;
            margin: auto 0;
        }

        .contenido-centrado {
            text-align: center;
            align-items: center;
            justify-content: center;
        }

        .contenedor-botones {
            width: 100%;
            display: grid;
            gap: 0.9rem;
        }

        .boton,
        .boton-secundario,
        .boton-icono,
        .boton-accion {
            border: 1px solid transparent;
            background: var(--acento);
            color: white;
            border-radius: 999px;
            padding: 0.82rem 1rem;
            min-height: 3rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            transition: background 0.18s ease, transform 0.18s ease, opacity 0.18s ease;
        }

        .boton:hover,
        .boton-secundario:hover,
        .boton-icono:hover,
        .boton-accion:hover {
            background: var(--acento-oscuro);
        }

        .boton-secundario {
            background: transparent;
            color: var(--texto);
            border-color: var(--borde);
        }

        .boton-icono {
            width: 2.8rem;
            min-width: 2.8rem;
            padding: 0;
            background: transparent;
            color: var(--texto);
            border-color: var(--borde);
            font-size: 1.15rem;
            font-weight: 700;
        }

        .boton-confirmacion {
            border-color: rgba(141, 100, 66, 0.25);
        }

        .boton-deshabilitado,
        button:disabled,
        input:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }

        .titulo-principal,
        .titulo-seccion {
            margin: 0;
            font-size: clamp(1.9rem, 4vw, 2.35rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            text-align: center;
        }

        .titulo-seccion {
            font-size: 1.75rem;
        }

        .texto-normal,
        .texto-suave {
            margin: 0;
            color: var(--texto-suave);
            line-height: 1.45;
        }

        .formulario {
            width: 100%;
            display: grid;
            gap: 1rem;
        }

        .grupo-campo {
            display: grid;
            gap: 0.45rem;
        }

        .etiqueta {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .entrada-texto {
            width: 100%;
            min-height: 3.2rem;
            border-radius: 1rem;
            border: 1px solid var(--borde);
            background: var(--fondo-panel);
            padding: 0.9rem 1rem;
            color: var(--texto);
        }

        .entrada-texto:focus {
            outline: none;
            border-color: var(--borde-activo);
            box-shadow: 0 0 0 4px rgba(185, 141, 102, 0.12);
        }

        .zona-errores {
            border: 1px dashed rgba(214, 154, 144, 0.7);
            background: rgba(248, 225, 220, 0.35);
            border-radius: 1.15rem;
            padding: 0.9rem 1rem;
            display: grid;
            align-content: start;
            gap: 0.45rem;
        }
        
        .zona-errores .texto-normal {
            color: #a24a40;
            font-weight: 700;
        }

        .mensajes-flotantes {
            position: absolute;
            top: 5.5rem;
            left: 1.5rem;
            right: 1.5rem;
            display: grid;
            gap: 0.7rem;
            pointer-events: none;
            z-index: 8;
        }

        .mensaje-sistema {
            padding: 0.9rem 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(124, 164, 136, 0.4);
            background: var(--exito);
            color: #284630;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .mensaje-sistema.error {
            border-color: var(--error-borde);
            background: var(--error);
            color: #7a3c33;
            font-weight: 700;
        }

        .mensaje-sistema.ocultando {
            opacity: 0;
            transform: translateY(-0.35rem);
        }

        .bloque-perfil,
        .panel-minimo,
        .panel-liso {
            border: 1px solid var(--borde);
            background: var(--fondo-panel);
            border-radius: 1.3rem;
            padding: 1rem;
        }

        .bloque-perfil {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            max-width: 11.5rem;
            margin-left: auto;
        }

        .avatar {
            width: 2.8rem;
            height: 2.8rem;
            border-radius: 50%;
            border: 1px solid var(--borde);
            background: linear-gradient(145deg, #f7f2ec, #ece2d5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--acento-oscuro);
            flex-shrink: 0;
        }

        .truncado {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .datos-perfil {
            min-width: 0;
            display: grid;
            gap: 0.18rem;
        }

        .saldo {
            font-weight: 700;
            color: var(--texto);
        }

        .lista-vertical {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 0.7rem;
        }

        .fila-lista {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 0.8rem;
            align-items: center;
            border-bottom: 1px solid rgba(216, 204, 189, 0.5);
            padding-bottom: 0.5rem;
        }

        .fila-lista:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .bloque-acciones-partida {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.65rem;
        }

        .fila-acciones-flex {
            display: flex;
            gap: 0.65rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .cartas-comunitarias,
        .cartas-privadas {
            display: flex;
            gap: 0.55rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .carta {
            width: 3.15rem;
            height: 4.45rem;
            border-radius: 0.85rem;
            border: 1px solid var(--borde);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .carta--oculta {
            background:
                linear-gradient(135deg, rgba(185, 141, 102, 0.16), rgba(141, 100, 66, 0.25)),
                repeating-linear-gradient(
                    135deg,
                    rgba(141, 100, 66, 0.16),
                    rgba(141, 100, 66, 0.16) 8px,
                    rgba(255, 255, 255, 0.7) 8px,
                    rgba(255, 255, 255, 0.7) 16px
                );
        }

        .jugadores-mesa {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(4.4rem, 1fr));
            gap: 0.8rem;
            text-align: center;
        }

        .jugador-mesa {
            min-width: 0;
            display: grid;
            gap: 0.3rem;
            justify-items: center;
        }

        .jugador-retirado {
            opacity: 0.55;
            text-decoration: line-through;
        }

        .panel-jugador {
            margin-top: auto;
            display: grid;
            gap: 1rem;
        }

        .mano-privada {
            display: grid;
            gap: 0.75rem;
            justify-items: center;
            padding-top: 0.5rem;
        }

        .mano-privada .cartas-privadas .carta span:last-child,
        .mano-privada .marcador-mano {
            opacity: 0;
            transition: opacity 0.18s ease;
        }

        .mano-privada .cartas-privadas .carta {
            position: relative;
            overflow: hidden;
        }

        .mano-privada .cartas-privadas .carta span:first-child {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(135deg, rgba(185, 141, 102, 0.16), rgba(141, 100, 66, 0.25)),
                repeating-linear-gradient(
                    135deg,
                    rgba(141, 100, 66, 0.16),
                    rgba(141, 100, 66, 0.16) 8px,
                    rgba(255, 255, 255, 0.7) 8px,
                    rgba(255, 255, 255, 0.7) 16px
                );
        }

        .mano-privada:hover .cartas-privadas .carta span:first-child {
            opacity: 0;
        }

        .mano-privada:hover .cartas-privadas .carta span:last-child,
        .mano-privada:hover .marcador-mano {
            opacity: 1;
        }

        .marcador-mano {
            font-weight: 700;
        }

        .reloj-turno {
            position: sticky;
            margin: 0 auto;
            bottom: 0;
            width: fit-content;
            padding: 0.6rem 0.85rem;
            border-radius: 999px;
            background: var(--texto);
            color: white;
            font-weight: 700;
        }

        .accion-destruction,
        .accion-destruccion {
            background: #d27d72;
            border-color: transparent;
            color: white;
        }

        .accion-destruction:hover,
        .accion-destruccion:hover {
            background: #b96357;
        }

        .loader-texto {
            font-size: 1.6rem;
            letter-spacing: 0.35rem;
            min-height: 2rem;
        }

        .modal-confirmacion {
            position: fixed;
            inset: 0;
            background: rgba(27, 27, 27, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 30;
        }

        .modal-confirmacion.activo {
            display: flex;
        }

        .modal-confirmacion__panel {
            width: min(100%, 22rem);
            background: var(--fondo-panel);
            border-radius: 1.4rem;
            padding: 1.3rem;
            border: 1px solid var(--borde);
            box-shadow: var(--sombra);
            display: grid;
            gap: 1rem;
        }

        .modal-confirmacion__acciones {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.8rem;
        }

        .oculto {
            display: none !important;
        }

        .texto-centro {
            text-align: center;
        }

        .apilado {
            display: grid;
            gap: 0.6rem;
        }

        .pequeno {
            font-size: 0.9rem;
        }

        .micro {
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="pantalla {% block pantalla_clase %}{% endblock %}">
            <div class="barra-superior">
                {% block barra_superior %}{% endblock %}
            </div>
            {% if messages %}
                <div class="mensajes-flotantes">
                    {% for message in messages %}
                        <div class="mensaje-sistema{% if message.tags == 'error' %} error{% endif %}" data-mensaje-temporal>
                            {{ message|corregir_mojibake }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
            <main class="contenido-scroll {% block contenido_clase %}{% endblock %}">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <div class="modal-confirmacion" id="modal-confirmacion">
        <div class="modal-confirmacion__panel">
            <div class="apilado">
                <h2 class="titulo-seccion" style="font-size:1.3rem;">Confirmar</h2>
                <p class="texto-normal" id="modal-confirmacion-texto"></p>
            </div>
            <div class="modal-confirmacion__acciones">
                <button class="boton-secundario" type="button" id="modal-confirmacion-cancelar">Cancelar</button>
                <button class="boton boton-confirmacion" type="button" id="modal-confirmacion-aceptar">Continuar</button>
            </div>
        </div>
    </div>

    <script>
        (() => {
            const modal = document.getElementById("modal-confirmacion");
            const texto = document.getElementById("modal-confirmacion-texto");
            const botonAceptar = document.getElementById("modal-confirmacion-aceptar");
            const botonCancelar = document.getElementById("modal-confirmacion-cancelar");
            let accionPendiente = null;

            const cerrarModal = () => {
                modal.classList.remove("activo");
                accionPendiente = null;
            };

            const abrirModal = (mensaje, callback) => {
                texto.textContent = mensaje;
                accionPendiente = callback;
                modal.classList.add("activo");
            };

            document.addEventListener("click", (event) => {
                const enlace = event.target.closest("[data-confirmacion-enlace]");
                if (!enlace) {
                    return;
                }
                event.preventDefault();
                abrirModal(enlace.dataset.confirmacionEnlace, () => {
                    window.location.href = enlace.href;
                });
            });

            document.addEventListener("submit", (event) => {
                const formulario = event.target;
                const mensaje = formulario.dataset.confirmacion;
                if (!mensaje || formulario.dataset.confirmado === "si") {
                    return;
                }
                event.preventDefault();
                abrirModal(mensaje, () => {
                    formulario.dataset.confirmado = "si";
                    formulario.requestSubmit();
                });
            });

            botonCancelar.addEventListener("click", cerrarModal);
            modal.addEventListener("click", (event) => {
                if (event.target === modal) {
                    cerrarModal();
                }
            });
            botonAceptar.addEventListener("click", () => {
                if (accionPendiente) {
                    const accion = accionPendiente;
                    cerrarModal();
                    accion();
                }
            });

            document.addEventListener("click", async (event) => {
                const botonCopiar = event.target.closest("[data-copiar-objetivo]");
                if (!botonCopiar) {
                    return;
                }
                const objetivo = document.querySelector(botonCopiar.dataset.copiarObjetivo);
                if (!objetivo) {
                    return;
                }
                try {
                    await navigator.clipboard.writeText(objetivo.value);
                    botonCopiar.textContent = "Copiado";
                    window.setTimeout(() => {
                        botonCopiar.textContent = "Copiar";
                    }, 1400);
                } catch (error) {
                    botonCopiar.textContent = "Error";
                }
            });

            document.querySelectorAll("[data-mensaje-temporal]").forEach((mensaje) => {
                window.setTimeout(() => {
                    mensaje.classList.add("ocultando");
                    window.setTimeout(() => {
                        mensaje.remove();
                    }, 260);
                }, 3200);
            });
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
